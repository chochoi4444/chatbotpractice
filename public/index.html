<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot Practice</title>
  <style>
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
      --user: #2563eb; --user-text: #ffffff; --bot: #eef0f3; --border: #e3e5e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318; --panel: #1a1d23; --text: #e6e8eb; --muted: #9aa1ab;
        --user: #3b82f6; --user-text: #ffffff; --bot: #262a32; --border: #2c313a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100dvh; display: flex; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    .app { width: 100%; max-width: 760px; display: flex; flex-direction: column; background: var(--panel); border-inline: 1px solid var(--border); }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 17px; margin: 0; }
    header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: none; color: #dc2626; font-size: 14px; }
    .msg.typing { color: var(--muted); }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    textarea {
      flex: 1; resize: none; max-height: 160px; padding: 10px 12px; font: inherit;
      border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
    }
    form button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--user); color: #fff; font: inherit; cursor: pointer; }
    form button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>💬 Chatbot Practice</h1>
      <button id="reset" type="button">새 대화</button>
    </header>
    <main id="messages"><p class="empty">무엇이든 물어보세요!</p></main>
    <form id="form">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)" required></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let history = [];

    function addMessage(role, text) {
      messagesEl.querySelector('.empty')?.remove();
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    async function send(text) {
      history.push({ role: 'user', content: text });
      addMessage('user', text);
      const typing = addMessage('assistant typing', '입력 중…');
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json().catch(() => ({}));
        typing.remove();
        if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
        history.push({ role: 'assistant', content: data.reply });
        addMessage('assistant', data.reply);
      } catch (err) {
        typing.remove();
        history.pop(); // 실패한 질문은 기록에서 제거
        addMessage('error', `⚠️ ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = '';
      input.style.height = 'auto';
      send(text);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    });

    document.getElementById('reset').addEventListener('click', () => {
      history = [];
      messagesEl.innerHTML = '<p class="empty">무엇이든 물어보세요!</p>';
      input.focus();
    });
  </script>
</body>
</html>
